workflows:
  ios-unsigned:
    name: iOS unsigned
    environment:
      flutter: 3.38.9
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate Drift code
        script: dart run build_runner build --delete-conflicting-outputs --force-jit
      - name: Run Flutter tests
        script: flutter test
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r kain_track-unsigned.ipa Payload
    artifacts:
      - kain_track-unsigned.ipa
